<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Zeora</title>
    
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap-grid.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=23">
</head>
<body class="antialiased">
    <div id="toast"><i class="fa-solid fa-circle-check text-green-400"></i> <span id="toast-msg">Copied successfully</span></div>

    <style>
        .error-page-nav {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 720px;
            margin: 0 auto;
            padding: 16px 20px;
        }

        .error-page-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 24px var(--card-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .error-page-back:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 32px var(--card-hover-shadow);
        }

        .error-page-theme {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--card-border);
            border-radius: 50%;
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 24px var(--card-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .error-page-theme:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 32px var(--card-hover-shadow);
        }

        .error-page-theme img {
            width: 22px;
            height: 22px;
        }

        /* 加载动画 - Uiverse by andrew-manzyk (橙色调) */
        .loader {
            --color-one: #ffbf48;
            --color-two: #be4a1d;
            --color-three: #ffbf4780;
            --color-four: #bf4a1d80;
            --color-five: #ffbf4740;
            --time-animation: 1.2s;
            --size: 1;
            position: relative;
            border-radius: 50%;
            transform: scale(var(--size));
            box-shadow:
                0 0 25px 0 var(--color-three),
                0 20px 50px 0 var(--color-four);
            animation: colorize calc(var(--time-animation) * 3) ease-in-out infinite;
        }
        .loader::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border-top: solid 1px var(--color-one);
            border-bottom: solid 1px var(--color-two);
            background: linear-gradient(180deg, var(--color-five), var(--color-four));
            box-shadow:
                inset 0 10px 10px 0 var(--color-three),
                inset 0 -10px 10px 0 var(--color-four);
        }
        .loader .box {
            width: 100px;
            height: 100px;
            background: linear-gradient(
                180deg,
                var(--color-one) 30%,
                var(--color-two) 70%
            );
            mask: url(#clipping);
            -webkit-mask: url(#clipping);
        }
        .loader svg {
            position: absolute;
        }
        .loader svg #clipping {
            filter: contrast(15);
            animation: roundness calc(var(--time-animation) / 2) linear infinite;
        }
        .loader svg #clipping polygon {
            filter: blur(7px);
        }
        .loader svg #clipping polygon:nth-child(1) {
            transform-origin: 75% 25%;
            transform: rotate(90deg);
        }
        .loader svg #clipping polygon:nth-child(2) {
            transform-origin: 50% 50%;
            animation: rotation var(--time-animation) linear infinite reverse;
        }
        .loader svg #clipping polygon:nth-child(3) {
            transform-origin: 50% 60%;
            animation: rotation var(--time-animation) linear infinite;
            animation-delay: calc(var(--time-animation) / -3);
        }
        .loader svg #clipping polygon:nth-child(4) {
            transform-origin: 40% 40%;
            animation: rotation var(--time-animation) linear infinite reverse;
        }
        .loader svg #clipping polygon:nth-child(5) {
            transform-origin: 40% 40%;
            animation: rotation var(--time-animation) linear infinite reverse;
            animation-delay: calc(var(--time-animation) / -2);
        }
        .loader svg #clipping polygon:nth-child(6) {
            transform-origin: 60% 40%;
            animation: rotation var(--time-animation) linear infinite;
        }
        .loader svg #clipping polygon:nth-child(7) {
            transform-origin: 60% 40%;
            animation: rotation var(--time-animation) linear infinite;
            animation-delay: calc(var(--time-animation) / -1.5);
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes roundness {
            0%, 60%, 100% { filter: contrast(15); }
            20%, 40% { filter: contrast(3); }
        }
        @keyframes colorize {
            0% { filter: hue-rotate(0deg); }
            20% { filter: hue-rotate(-30deg); }
            40% { filter: hue-rotate(-60deg); }
            60% { filter: hue-rotate(-90deg); }
            80% { filter: hue-rotate(-45deg); }
            100% { filter: hue-rotate(0deg); }
        }
        #loading-animation.is-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-skip {
            position: absolute;
            bottom: max(24px, env(safe-area-inset-bottom, 24px));
            right: 50%;
            transform: translateX(50%);
            padding: 8px 18px;
            border-radius: 999px;
            background: var(--card-bg);
            color: var(--text-primary, #1d1d1f);
            border: 1px solid var(--card-border, rgba(0,0,0,0.1));
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.2s ease;
            box-shadow: 0 6px 20px var(--card-shadow, rgba(0,0,0,0.08));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .loading-skip.is-visible {
            opacity: 0.85;
            pointer-events: auto;
        }
        .loading-skip:hover {
            opacity: 1;
            transform: translateX(50%) translateY(-1px);
        }
    </style>

    <!-- 加载动画 -->
    <div id="loading-animation" class="fixed inset-0 z-[9999] flex items-center justify-center transition-opacity duration-500" style="background: var(--bg-color);">
        <div class="loader">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <defs>
                    <mask id="clipping">
                        <polygon points="0,0 100,0 100,100 0,100" fill="black"></polygon>
                        <polygon points="25,25 75,25 50,75" fill="white"></polygon>
                        <polygon points="50,25 75,75 25,75" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                    </mask>
                </defs>
            </svg>
            <div class="box"></div>
        </div>
        <button id="loading-skip" type="button" aria-label="跳过加载动画" class="loading-skip">跳过动画 ›</button>
    </div>

    <nav class="error-page-nav">
        <a href="/" class="error-page-back">
            <i class="fa-solid fa-arrow-left"></i>
            <span>返回主页</span>
        </a>
        <button class="error-page-theme" id="theme-toggle" aria-label="切换主题">
            <img src="img/theme-toggle-icon.svg" alt="切换主题">
        </button>
    </nav>

    <section class="h-screen w-full flex flex-col justify-center items-center relative">
        <div class="text-center z-10 px-4">
            <h1 class="text-9xl md:text-[12rem] font-bold tracking-tighter text-black mb-6 select-none mix-blend-darken opacity-20">
                404
            </h1>
            <h2 id="error-title" class="text-3xl md:text-4xl font-bold text-black mb-4">
                页面未找到
            </h2>
            <p id="error-desc" class="text-gray-500 text-lg md:text-xl leading-relaxed mb-8 max-w-md mx-auto">
                抱歉，您访问的页面不存在或已被移除。
            </p>
            <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
                <a href="index.html" class="group px-8 py-3 bg-black text-white rounded-full font-medium transition-all hover:bg-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-house"></i>
                    <span id="btn-home">返回首页</span>
                </a>
                <button onclick="history.back()" class="group px-8 py-3 bg-gray-100 text-gray-700 rounded-full font-medium transition-all hover:bg-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span id="btn-back">返回上一页</span>
                </button>
            </div>
        </div>
    </section>

    <script>
        // --- Loading Animation ---
        (function () {
            const loading = document.getElementById('loading-animation');
            const skipBtn = document.getElementById('loading-skip');
            if (!loading) return;
            const isHidden = () => loading.classList.contains('is-hidden') || loading.style.display === 'none';
            const showSkip = setTimeout(() => { if (!isHidden()) skipBtn?.classList.add('is-visible'); }, 3000);
            const hide = () => {
                if (isHidden()) return;
                clearTimeout(showSkip);
                skipBtn?.classList.remove('is-visible');
                loading.classList.add('is-hidden');
                setTimeout(() => { loading.style.display = 'none'; }, 500);
            };
            skipBtn?.addEventListener('click', hide);
            const auto = setTimeout(hide, 1200);
            const onLoad = () => { clearTimeout(auto); setTimeout(hide, 200); };
            if (document.readyState === 'complete') onLoad();
            else window.addEventListener('load', onLoad);
        })();

        // --- Theme Toggle ---
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            htmlElement.setAttribute('data-theme', 'dark');
        }
        themeToggle?.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
