<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeora | Gallery</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap-grid.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=32">
</head>
<body class="antialiased">
    <nav class="navbar show">
        <div class="navbar-container">
            <button class="navbar-item nav-menu-toggle" id="nav-menu-toggle" type="button" aria-label="打开菜单" aria-controls="nav-section-menu" aria-expanded="false">
                <img src="img/MdiAppleKeyboardCommand-dark.svg" alt="" class="nav-command-icon nav-command-icon-dark">
                <img src="img/MdiAppleKeyboardCommand-light.svg" alt="" class="nav-command-icon nav-command-icon-light">
            </button>
            <a href="index.html" class="navbar-logo">
                <img src="img/zeora-logo-light.png" alt="Zeora" class="logo-light">
                <img src="img/zeora-logo-dark.png" alt="Zeora" class="logo-dark">
                <span id="nav-music-lyrics" class="nav-music-lyrics">歌词加载中...</span>
                <button id="nav-music-toggle" class="nav-music-toggle" type="button" aria-label="暂停播放">
                    <i class="fa-solid fa-pause"></i>
                </button>
            </a>
            <button class="navbar-item theme-toggle" id="theme-toggle" type="button" aria-label="切换主题">
                <img src="img/theme-toggle-icon.svg" alt="切换主题" class="theme-icon-svg">
            </button>
        </div>
    </nav>

    <div class="nav-sheet-layer" id="nav-sheet-layer" aria-hidden="true" inert>
        <button class="nav-sheet-backdrop" type="button" aria-label="关闭菜单"></button>
        <div class="nav-section-menu" id="nav-section-menu" role="dialog" aria-modal="true" aria-labelledby="nav-sheet-title" tabindex="-1">
            <div class="nav-sheet-handle" aria-hidden="true"></div>
            <h2 id="nav-sheet-title">菜单</h2>
            <div class="nav-sheet-options">
                <a href="websites.html" data-target="websites"><i class="fa-solid fa-globe" aria-hidden="true"></i><span>网站</span></a>
                <a href="gallery.html" data-target="gallery"><i class="fa-solid fa-images" aria-hidden="true"></i><span>相册</span></a>
                <a href="index.html#music" data-target="music"><i class="fa-solid fa-music" aria-hidden="true"></i><span>音乐</span></a>
                <a href="index.html#social" data-target="social"><i class="fa-solid fa-address-card" aria-hidden="true"></i><span>社交</span></a>
                <a href="projects.html" data-target="projects"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><span>我的项目</span></a>
            </div>
            <button class="nav-sheet-cancel" type="button">取消</button>
        </div>
    </div>

    <div id="contact-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="ios-action-sheet" onclick="event.stopPropagation()">
            <div id="modal-icon" class="mb-4 text-4xl text-gray-800"></div>
            <h3 id="modal-title" class="text-xl font-bold mb-1 text-black">Contact</h3>
            <p id="modal-value" class="text-gray-500 text-sm mb-6 break-all">ID / Link</p>
            <div class="space-y-3">
                <button id="btn-copy" class="action-btn btn-secondary" onclick="handleCopy()"><i class="fa-regular fa-copy mr-2"></i> 复制 ID / 账号</button>
                <button id="btn-go" class="action-btn btn-primary" onclick="handleGo()"><i class="fa-solid fa-arrow-up-right-from-square mr-2"></i> 前往链接</button>
                <button class="text-gray-400 text-sm mt-4 hover:text-gray-600 transition-colors" onclick="closeModalDirect()">取消</button>
            </div>
        </div>
    </div>

    <div class="site-page" id="site-page">
    <main class="container mx-auto px-4 pb-32" style="max-width: 1100px; padding-top: 150px;">
        <section id="gallery" class="carousel-section py-20 reveal-up active" aria-labelledby="gallery-title">
            <div class="container mx-auto px-4 mb-8" style="max-width: 1100px;">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest text-center mb-3">Zeora / Moments</p>
                <h1 id="gallery-title" class="text-4xl md:text-6xl font-bold tracking-tight text-center mb-4">Gallery</h1>
                <p class="text-gray-500 text-center">用 Coverflow 浏览相册</p>
            </div>
            <div class="coverflow-gallery" aria-roledescription="carousel" aria-label="Zeora 相册" tabindex="0">
                <div class="coverflow-stage">
                    <figure class="coverflow-card" data-title="风景"><img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&h=1200&fit=crop" alt="风景" draggable="false" /></figure>
                    <figure class="coverflow-card" data-title="代码"><img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=900&h=1200&fit=crop" alt="代码" draggable="false" /></figure>
                    <figure class="coverflow-card" data-title="团队"><img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=900&h=1200&fit=crop" alt="团队" draggable="false" /></figure>
                    <figure class="coverflow-card" data-title="编程"><img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=900&h=1200&fit=crop" alt="编程" draggable="false" /></figure>
                    <figure class="coverflow-card" data-title="设计"><img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=900&h=1200&fit=crop" alt="设计" draggable="false" /></figure>
                </div>
            </div>
            <div class="carousel-controls" aria-label="相册控制">
                <button class="carousel-btn carousel-btn-prev" type="button" aria-label="上一张"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="coverflow-dots" role="tablist" aria-label="选择相册图片"></div>
                <button class="carousel-btn carousel-btn-next" type="button" aria-label="下一张"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </section>
    </main>

    <footer id="social" class="footer-root">
        <div class="footer-capsule reveal-up">
            <div class="footer-capsule-inner">
                <div class="footer-bottom">
                    <!-- 配置：页脚像素文字；data-pixel-text 会被 script.js 读取并绘制成粒子文字 -->
                    <div class="footer-pixel-drift" data-pixel-text="ZEORA" aria-label="ZEORA pixel drift">
                        <canvas class="footer-pixel-canvas"></canvas>
                    </div>
                    <div class="footer-icp">
                        <!-- 配置：备案链接 1；href 和显示文本分别控制跳转地址与页脚显示备案号 -->
                        <a href="https://icp.gov.moe/?keyword=20253156" target="_blank" rel="noopener noreferrer" class="hover:text-gray-600 transition-colors">
                            萌 ICP 备 20253156 号
                        </a>
                        <span class="footer-icp-divider">|</span>
                        <!-- 配置：备案链接 2；这里是工信部备案跳转和显示文案 -->
                        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="hover:text-gray-600 transition-colors">
                            苏 ICP 备 2026019501 号
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    </div>
    <script src="script.js?v=19"></script>
</body>
</html>
