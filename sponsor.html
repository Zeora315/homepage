<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeora | Sponsor</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap-grid.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=37">
</head>
<body class="antialiased sponsor-page">
    <!-- 加载动画：与首页一致，页面就绪后由 script.js 释放 -->
    <div id="loading-animation" class="fixed inset-0 flex items-center justify-center transition-opacity duration-500" style="z-index: 9999; background: var(--bg-color);">
        <div class="loader">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <defs>
                    <mask id="clipping">
                        <polygon points="0,0 100,0 100,100 0,100" fill="black"></polygon>
                        <polygon points="25,25 75,25 50,75" fill="white"></polygon>
                        <polygon points="50,25 75,75 25,75" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                    </mask>
                </defs>
            </svg>
            <div class="box"></div>
        </div>
    </div>

    <nav class="navbar show">
        <div class="navbar-container">
            <button class="navbar-item nav-menu-toggle" id="nav-menu-toggle" type="button" aria-label="打开菜单" aria-controls="nav-section-menu" aria-expanded="false">
                <img src="img/MdiAppleKeyboardCommand-dark.svg" alt="" class="nav-command-icon nav-command-icon-dark">
                <img src="img/MdiAppleKeyboardCommand-light.svg" alt="" class="nav-command-icon nav-command-icon-light">
            </button>
            <a href="index.html" class="navbar-logo">
                <img src="img/zeora-logo-light.png" alt="Zeora" class="logo-light">
                <img src="img/zeora-logo-dark.png" alt="Zeora" class="logo-dark">
            </a>
            <button class="navbar-item theme-toggle" id="theme-toggle" type="button" aria-label="切换主题">
                <img src="img/theme-toggle-icon.svg" alt="切换主题" class="theme-icon-svg">
            </button>
        </div>
    </nav>

    <div class="nav-sheet-layer" id="nav-sheet-layer" aria-hidden="true" inert>
        <button class="nav-sheet-backdrop" type="button" aria-label="关闭菜单"></button>
        <div class="nav-section-menu" id="nav-section-menu" role="dialog" aria-modal="true" aria-labelledby="nav-sheet-title" tabindex="-1">
            <div class="nav-sheet-handle" aria-hidden="true"></div>
            <h2 id="nav-sheet-title">菜单</h2>
            <div class="nav-sheet-options">
                <a href="websites.html" data-target="websites"><i class="fa-solid fa-globe" aria-hidden="true"></i><span>网站</span></a>
                <a href="index.html#gallery" data-target="gallery"><i class="fa-solid fa-images" aria-hidden="true"></i><span>相册</span></a>
                <a href="index.html#music" data-target="music"><i class="fa-solid fa-music" aria-hidden="true"></i><span>音乐</span></a>
                <a href="index.html#social" data-target="social"><i class="fa-solid fa-address-card" aria-hidden="true"></i><span>社交</span></a>
                <a href="projects.html" data-target="projects"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><span>项目</span></a>
                <a href="sponsor.html" data-target="sponsor"><i class="fa-solid fa-hand-holding-heart" aria-hidden="true"></i><span>赞助</span></a>
            </div>
            <button class="nav-sheet-cancel" type="button">取消</button>
        </div>
    </div>

    <main class="sponsor-main">
        <section id="sponsor" class="sponsor-section reveal-up active" aria-labelledby="sponsor-title">
            <!-- 标题栏：与网站 / 项目页保持统一，文案与渐变色可单独配置 -->
            <div class="projects-heading-block">
                <p class="projects-kicker">Zeora / Sponsor</p>
                <h1 id="sponsor-title">赞助</h1>
                <p>如果这些项目和站点帮到了你，可以请我喝杯咖啡。</p>
            </div>

            <!-- 赞助说明 / 赞助去向 / 赞助方式 / 赞助名单，全部由 data.js 的 sponsor 生成 -->
            <p class="sponsor-intro" data-sponsor-intro></p>
            <div class="sponsor-usage-grid"></div>

            <h2 class="sponsor-block-title">赞助方式</h2>
            <div class="sponsor-methods-grid"></div>

            <h2 class="sponsor-block-title">赞助名单</h2>
            <div class="sponsor-list"></div>
        </section>
    </main>

    <footer class="footer-root">
        <div class="footer-capsule reveal-up">
            <div class="footer-capsule-inner">
                <div class="footer-bottom">
                    <!-- 配置：页脚像素文字；data-pixel-text 会被 script.js 读取并绘制成粒子文字 -->
                    <div class="footer-pixel-drift" data-pixel-text="ZEORA" aria-label="ZEORA pixel drift">
                        <canvas class="footer-pixel-canvas"></canvas>
                    </div>
                    <div class="footer-icp">
                        <a href="https://icp.gov.moe/?keyword=20253156" target="_blank" rel="noopener noreferrer">萌 ICP 备 20253156 号</a>
                        <span class="footer-icp-divider">|</span>
                        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏 ICP 备 2026019501 号</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <script src="data.js?v=5"></script>
    <script src="script.js?v=20"></script>
</body>
</html>
